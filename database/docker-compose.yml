services:
  postgres:
    image: postgres:17-alpine
    container_name: movieapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movieapp}
      POSTGRES_USER: ${POSTGRES_USER:-movieapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movieapp_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - movieapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movieapp} -d ${POSTGRES_DB:-movieapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  movieapp_postgres_data:
