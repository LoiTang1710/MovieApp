name: CodiumAI PR-Agent với Gemini 3.1 Pro

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent_job:
    if: ${{ github.event.issue.pull_request || github.event.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          # 1. Cấu hình chạy chính xác mô hình Gemini 3.1 Pro
          config.model: "gemini/gemini-3.1-pro"
          config.fallback_models: '["gemini/gemini-3.1-pro"]'
          
          # 2. Gọi API Key bảo mật từ hệ thống GitHub Secrets
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # 3. Token hệ thống để cấp quyền cho bot tạo comment trên PR
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # 4. Ép tự động phân tích và phản hồi bằng Tiếng Việt
          PR_REVIEWS.LANGUAGE: "Vietnamese"
          PR_DESCRIPTION.LANGUAGE: "Vietnamese"